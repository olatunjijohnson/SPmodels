name: Build SPmodels for WebR

on:
  push:
    branches: [main]
    paths:
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'R/**'
      - '.github/workflows/build-webr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-webr:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out SPmodels
        uses: actions/checkout@v4

      - name: Build WebAssembly package repository
        uses: r-wasm/actions/build-rwasm@v3
        with:
          packages: .
          repo-path: _site
          webr-image: ghcr.io/r-wasm/webr@sha256:445832203d9ee8377f35e364706ec550d00842437ffb4fbdea65613c4696f9b2

      - name: Set up Node.js for the WebR runtime smoke check
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install WebR JavaScript runtime
        run: npm install --no-save --no-package-lock webr@0.6.0

      - name: Install SPmodels in WebR and run core workflow
        run: node tools/webr-smoke.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload WebR package repository for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy-webr:
    needs: build-webr
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish WebR package repository
        id: deployment
        uses: actions/deploy-pages@v4
